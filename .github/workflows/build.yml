name: Build Saydali APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }} \
            --dart-define=DEV_PASS=${{ secrets.DEV_PASS }} \
            --dart-define=ADMIN_CODE_1=${{ secrets.ADMIN_CODE_1 }} \
            --dart-define=ADMIN_CODE_2=${{ secrets.ADMIN_CODE_2 }} \
            --dart-define=WEB_PORTAL_URL=${{ secrets.WEB_PORTAL_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saydali-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
