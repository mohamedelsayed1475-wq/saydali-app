name: Build Saydali APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Old Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            saydali-pro-aab
            saydali-pro-apk
          failOnError: false

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build AppBundle for Play Store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEV_PASS: ${{ secrets.DEV_PASS }}
          ADMIN_CODE_1: ${{ secrets.ADMIN_CODE_1 }}
          ADMIN_CODE_2: ${{ secrets.ADMIN_CODE_2 }}
          WEB_PORTAL_URL: ${{ secrets.WEB_PORTAL_URL }}
        run: |
          CLEAN_SUPABASE_URL=$(echo -n "$SUPABASE_URL" | tr -d '\n\r')
          CLEAN_SUPABASE_KEY=$(echo -n "$SUPABASE_KEY" | tr -d '\n\r')
          CLEAN_SUPABASE_SERVICE_KEY=$(echo -n "$SUPABASE_SERVICE_KEY" | tr -d '\n\r')
          CLEAN_DEV_PASS=$(echo -n "$DEV_PASS" | tr -d '\n\r')
          CLEAN_ADMIN_CODE_1=$(echo -n "$ADMIN_CODE_1" | tr -d '\n\r')
          CLEAN_ADMIN_CODE_2=$(echo -n "$ADMIN_CODE_2" | tr -d '\n\r')
          CLEAN_WEB_PORTAL_URL=$(echo -n "$WEB_PORTAL_URL" | tr -d '\n\r')
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define="SUPABASE_URL=$CLEAN_SUPABASE_URL" \
            --dart-define="SUPABASE_KEY=$CLEAN_SUPABASE_KEY" \
            --dart-define="SUPABASE_SERVICE_KEY=$CLEAN_SUPABASE_SERVICE_KEY" \
            --dart-define="DEV_PASS=$CLEAN_DEV_PASS" \
            --dart-define="ADMIN_CODE_1=$CLEAN_ADMIN_CODE_1" \
            --dart-define="ADMIN_CODE_2=$CLEAN_ADMIN_CODE_2" \
            --dart-define="WEB_PORTAL_URL=$CLEAN_WEB_PORTAL_URL"

      # Removed actions/upload-artifact to save quota. Will upload to Release at the end.

      - name: Build APK for Local Testing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEV_PASS: ${{ secrets.DEV_PASS }}
          ADMIN_CODE_1: ${{ secrets.ADMIN_CODE_1 }}
          ADMIN_CODE_2: ${{ secrets.ADMIN_CODE_2 }}
          WEB_PORTAL_URL: ${{ secrets.WEB_PORTAL_URL }}
        run: |
          CLEAN_SUPABASE_URL=$(echo -n "$SUPABASE_URL" | tr -d '\n\r')
          CLEAN_SUPABASE_KEY=$(echo -n "$SUPABASE_KEY" | tr -d '\n\r')
          CLEAN_SUPABASE_SERVICE_KEY=$(echo -n "$SUPABASE_SERVICE_KEY" | tr -d '\n\r')
          CLEAN_DEV_PASS=$(echo -n "$DEV_PASS" | tr -d '\n\r')
          CLEAN_ADMIN_CODE_1=$(echo -n "$ADMIN_CODE_1" | tr -d '\n\r')
          CLEAN_ADMIN_CODE_2=$(echo -n "$ADMIN_CODE_2" | tr -d '\n\r')
          CLEAN_WEB_PORTAL_URL=$(echo -n "$WEB_PORTAL_URL" | tr -d '\n\r')
          flutter build apk --release \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define="SUPABASE_URL=$CLEAN_SUPABASE_URL" \
            --dart-define="SUPABASE_KEY=$CLEAN_SUPABASE_KEY" \
            --dart-define="SUPABASE_SERVICE_KEY=$CLEAN_SUPABASE_SERVICE_KEY" \
            --dart-define="DEV_PASS=$CLEAN_DEV_PASS" \
            --dart-define="ADMIN_CODE_1=$CLEAN_ADMIN_CODE_1" \
            --dart-define="ADMIN_CODE_2=$CLEAN_ADMIN_CODE_2" \
            --dart-define="WEB_PORTAL_URL=$CLEAN_WEB_PORTAL_URL"

      - name: Create Release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "Automated build. Download the APK or AAB below."
          prerelease: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
